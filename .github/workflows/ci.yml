name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment only admits main, so pull request runs never see the token.
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Runs can finish testing out of order; only main's current head deploys, so an older run never rolls back.
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then echo current=true >> "$GITHUB_OUTPUT"; else echo "main moved to $head; skipping"; fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.head.outputs.current == 'true'
        name: Configure private presence access
        env:
          PRESENCE_READ_SECRET: ${{ secrets.PRESENCE_READ_SECRET }}
        run: |
          : "${PRESENCE_READ_SECRET:?Missing PRESENCE_READ_SECRET}"
          printf '%s' "$PRESENCE_READ_SECRET" | pnpm exec wrangler secret put PRESENCE_READ_SECRET
      - if: steps.head.outputs.current == 'true'
        run: pnpm exec wrangler deploy
